name: Daily Stock Bot

on:
  schedule:
    # 盤後結算：週一至週五 18:00 台灣時間（= UTC 10:00）
    - cron: '0 10 * * 1-5'
    # 盤前複習：週二至週六 08:00 台灣時間（= UTC 00:00）
    - cron: '0 0 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式 (close=盤後 / preview=盤前)'
        required: false
        default: 'close'

jobs:
  run_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Set RUN_MODE
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          elif [ "$(date -u +%H)" = "00" ]; then
            echo "RUN_MODE=preview" >> $GITHUB_ENV
          else
            echo "RUN_MODE=close" >> $GITHUB_ENV
          fi

      - name: Run bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_MODE: ${{ env.RUN_MODE }}
        run: python stock_bot.py
