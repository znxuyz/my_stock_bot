name: Daily Stock Bot
on:
  schedule:
    - cron: '10 9 * * 1-5' # 台北時間 17:10
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # 升級到 v4 解決 Node.js 舊版本問題
      
      - name: Set up Python
        uses: actions/setup-python@v5 # 升級到 v5 確保環境最穩定
        with:
          python-version: '3.12' # 使用更穩定的版本
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas FinMind tqdm
          
      - name: Run script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python stock_bot.py
