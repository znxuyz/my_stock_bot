name: Daily Stock Bot
on:
  schedule:
    - cron: '10 9 * * 1-5' # 台北時間 17:10 自動執行
  workflow_dispatch: # 保留手動執行按鈕

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 升級到 v4 解決警告
      - name: Set up Python
        uses: actions/setup-python@v5 # 升級到 v5 確保環境穩定
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }} # 確保這行有對應到你的 Secrets
        run: python stock_bot.py
