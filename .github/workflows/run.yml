name: Daily Stock Bot
on:
  schedule:
    - cron: '0 0 * * *' # 台北時間每天早上 08:00 執行
  workflow_dispatch: # 保留手動測試按鈕

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas FinMind
          
      - name: Run script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python stock_bot.py
