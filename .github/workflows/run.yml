name: Daily Stock Bot

on:
  schedule:
    # 盤後結算：提早到台灣 16:00 觸發（UTC 08:00）
    # 就算 GitHub 延遲 1 小時，最晚也是台灣 17:00 收到
    - cron: '0 8 * * 1-5'

    # 盤前複習：提早到台灣 06:00 觸發（UTC 22:00，前一天）
    # 就算延遲 1 小時，最晚也是台灣 07:00 收到
    - cron: '0 22 * * 0-4'

  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式 (close=盤後 / preview=盤前)'
        required: false
        default: 'close'

jobs:
  run_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Set RUN_MODE
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            # UTC 22:00 = 台灣隔日 06:00 → 盤前複習
            # UTC 08:00 = 台灣 16:00       → 盤後結算
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "22" ]; then
              echo "RUN_MODE=preview" >> $GITHUB_ENV
            else
              echo "RUN_MODE=close" >> $GITHUB_ENV
            fi
          fi

      - name: Run bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_MODE: ${{ env.RUN_MODE }}
        run: python stock_bot.py
