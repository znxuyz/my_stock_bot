name: Daily Stock Bot

on:
  schedule:
    # 盤後：台灣 16:00 觸發（UTC 08:00），就算延遲 1hr 也是 17:00 後資料已出
    - cron: '0 8 * * 1-5'
    # 盤前：台灣 06:00 觸發（UTC 22:00 前一天）
    - cron: '0 22 * * 0-4'

  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式 (auto / close=強制盤後 / preview=強制盤前)'
        required: false
        default: 'auto'

jobs:
  run_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Set RUN_MODE
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            # cron 觸發一律用 auto，讓腳本依台灣時間自己判斷
            echo "RUN_MODE=auto" >> $GITHUB_ENV
          fi

      - name: Run bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_MODE: ${{ env.RUN_MODE }}
        run: python stock_bot.py
